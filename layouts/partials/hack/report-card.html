{{/* Figma component set: Report-card (48:4834), State=Available | Expected. Available when `url` is set. */}}
{{ if .url }}
  <article class="hack-report">
    <span class="hack-report__icon">{{ .type | default "PDF" }}</span>
    <p class="text-sm font-bold uppercase mt-6">{{ .meta }}</p>
    <h3 class="text-2xl font-bold mt-3 mb-6">{{ .title }}</h3>
    <a class="hack-btn hack-btn--yellow mt-auto self-start" href="{{ .url }}">Go to page</a>
  </article>
{{ else }}
  <article class="hack-report hack-report--expected">
    <span class="hack-report__icon">…</span>
    <p class="text-sm font-bold uppercase mt-6">Expected</p>
    <h3 class="text-2xl font-bold mt-3 mb-6">{{ .title }}</h3>
    <span class="hack-btn hack-btn--disabled mt-auto self-start">Coming soon</span>
  </article>
{{ end }}
