{{/* Based on the existing "Highlighted Article" component. Expects an update. */}}
<article class="hack-card overflow-hidden">
  {{ with .image }}<img class="w-full aspect-[1080/835] object-cover object-[50%_8%]" src="{{ . }}" alt="{{ $.imageAlt }}" loading="lazy" />{{ end }}
  <div class="p-6">
    <span class="hack-label">Update #{{ .number }}</span>
    <h3 class="text-2xl font-bold mt-3">{{ .title }}</h3>
    <p class="hack-text mt-2">{{ (time .date).Format "2 Jan 2006" }}{{ with .teaser }} · {{ . }}{{ end }}</p>
    <a class="hack-btn hack-btn--outline-white mt-6" href="#update-{{ .number }}" data-hack-open="update-{{ .number }}">Read update</a>
  </div>
</article>
