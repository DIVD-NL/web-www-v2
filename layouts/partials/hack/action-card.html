{{/* Figma component: Action-card (48:4671). Expects {title, text | checklist}. */}}
<article class="hack-card p-6 desktop:p-8">
  <h3 class="text-2xl font-bold mb-4">{{ .title }}</h3>
  {{ with .text }}<p class="hack-text">{{ . }}</p>{{ end }}
  {{ with .checklist }}
    <ul class="hack-checklist hack-text">
      {{ range . }}<li>{{ . }}</li>{{ end }}
    </ul>
  {{ end }}
</article>
